version: '3.8'

services:
  # In-Memory Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: growly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - growly-net

  # PostgreSQL Relational Persistence
  postgres:
    image: postgres:16-alpine
    container_name: growly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: growly_user
      POSTGRES_PASSWORD: growly_password
      POSTGRES_DB: growly_db
    ports:
      - "5432:5432"
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growly_user -d growly_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - growly-net

  # Python 3.11 Google Finance Ingestion & Quant Anomaly Engine
  analytics:
    build:
      context: ./backend/analytics
      dockerfile: Dockerfile
    container_name: growly-analytics
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8000
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - growly-net

  # Golang 1.22 Streaming Gateway & Trie Search REST API
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: growly-gateway
    restart: unless-stopped
    environment:
      - PORT=4000
      - REDIS_URL=redis:6379
    depends_on:
      redis:
        condition: service_healthy
      analytics:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - growly-net

  # React 18 + Vite Web Client served via Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: growly-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - growly-net

networks:
  growly-net:
    driver: bridge
